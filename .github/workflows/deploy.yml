name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies (retry up to 3x)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: npm ci --no-audit --no-fund --prefer-offline
      - name: Build project (retry up to 2x)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 2
          retry_on: error
          command: npm run build
      - name: Verify dist output
        run: |
          set -e
          echo "=== dist contents ==="
          ls -la dist/
          echo "=== assets count ==="
          find dist -type f | wc -l
          test -f dist/index.html || { echo "FAIL: index.html missing" ; exit 1; }
          test -f dist/sw.js || { echo "FAIL: PWA sw.js missing" ; exit 1; }
          test -f dist/manifest.webmanifest || { echo "FAIL: manifest missing" ; exit 1; }
          echo "=== dist check passed ==="
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
