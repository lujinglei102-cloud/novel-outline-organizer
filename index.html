    <meta name="theme-color" content="#a78bfa" />

    <title>小说大纲梳理器</title>
    <script>
      ;(function () {
        var saved = localStorage.getItem('theme-mode')
        if (saved === 'light') {
          document.documentElement.classList.add('light-mode')
        }
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
